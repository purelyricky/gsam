name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-lock.txt
          pip install -r requirements-dev.txt coverage
      - name: Lint (ruff)
        run: ruff check gsam ace eval tests
      - name: Type check (mypy)
        run: mypy --ignore-missing-imports --follow-imports=silent log_config.py resume_utils.py config_schema.py experiment_tracker.py mock_llm.py
      - name: Dependency consistency
        run: pip check
      - name: Unit tests
        run: coverage run -m unittest discover -s tests -v
      - name: Coverage report
        run: coverage report -m --fail-under=60
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt || true
