[project]
name = "gsam"
version = "0.1.0"
description = "Graph-Structured Adaptive Memory extending the ACE agentic-context framework"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "tiktoken",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
    "scikit-learn>=1.0.0",
    "networkx>=3.0",
    "numpy>=1.24.0",
    "modal>=0.73.148",
]

[project.optional-dependencies]
dev = ["ruff>=0.4.0", "coverage", "mypy"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["clean_results", "mini_results_wrong", "images", "assets"]

[tool.ruff.lint]
# Correctness-focused rules (syntax errors, undefined names, invalid comparisons).
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
source = ["gsam", "ace"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
